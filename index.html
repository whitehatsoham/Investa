  /* ---------- accounts: manage the signed-in one ---------- */
  function renderAccount(v){
    const p=Profiles.active(); if(!p){ signOut(); return; }
    const lessons=Object.keys(state.done).length, badges=Object.keys(state.badges).length;
    const inv=state.invest;
    const acct = inv ? (()=>{ let t=inv.cash; for(const s in inv.holdings){
        const q=inv.quotes[s]; t+=inv.holdings[s].shares*((q&&q.c)||SEED_PRICES[s]||100); } return t; })() : null;
    const trades = inv && inv.ledger ? inv.ledger.length : 0;
    v.innerHTML=`<div class="lesson-wrap">
      <div class="page-head"><div class="section-eyebrow">Your account</div><h2>Account &amp; sign-in</h2></div>
      <div class="acct-row">
        <span class="ar-face">${p.avatar||"🌱"}</span>
        <div style="flex:1;min-width:180px"><h2>${p.name}</h2>
          <small>${p.pin?"🔒 PIN set":"No PIN"} · account made ${new Date(p.created).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}</small></div>
        <button class="btn" id="acSwitch" style="background:#fff;color:var(--brand-ink);box-shadow:none">Switch account</button>
      </div>
      <div class="profile-stats">
        <div class="ps"><b>${lessons}/${MODULES.length}</b><small>Lessons done</small></div>
        <div class="ps"><b>${state.xp}</b><small>XP</small></div>
        <div class="ps"><b>${badges}</b><small>Badges</small></div>
        ${acct!=null?`<div class="ps"><b>${fmt(acct)}</b><small>Portfolio</small></div>`:""}
        <div class="ps"><b>${trades}</b><small>Trades</small></div>
      </div>
      <div class="tool">
        <div class="section-eyebrow">Edit this account</div>
        <div class="grid2">
          <div class="field"><label>Name</label><input type="text" id="acName" maxlength="22" value="${p.name.replace(/"/g,'&quot;')}"></div>
          <div class="field"><label>PIN <span style="color:var(--muted);font-weight:400">— leave empty to remove</span></label>
            <input type="password" id="acPin" inputmode="numeric" maxlength="8" placeholder="${p.pin?"••••":"No PIN"}"></div>
        </div>
        <div class="field"><label>Face</label><div class="ava-pick" id="acAva">
          ${Profiles.AVATARS.map(a=>`<button type="button" data-a="${a}" class="${a===(p.avatar||"🌱")?"on":""}">${a}</button>`).join("")}
        </div></div>
        <button class="btn" id="acSave">Save changes</button>
      </div>
      <div class="callout">💾 <b>This account lives on this device.</b> It comes back automatically here, but it won't appear on another phone or computer, and clearing your browser data erases it. To carry it across, open <b>Invest → 📜 History</b> and copy your account code.</div>
      <div class="tool" style="border-color:var(--red-soft)">
        <div class="section-eyebrow" style="color:var(--red)">Danger zone</div>
        <p style="color:var(--ink-2);font-size:14.5px">Deleting removes this account and everything in it from this device — lessons, XP, badges and the portfolio. Other accounts here are untouched.</p>
        <button class="btn secondary" id="acDelete" style="color:var(--red);border-color:var(--red)">Delete ${p.name}</button>
      </div></div>`;
    let face=p.avatar||"🌱";
    v.querySelectorAll("#acAva button").forEach(b=>b.onclick=()=>{
      face=b.dataset.a; v.querySelectorAll("#acAva button").forEach(x=>x.classList.toggle("on",x===b));
    });
    document.getElementById("acSave").onclick=()=>{
      const nm=document.getElementById("acName").value.trim();
      const other=Profiles.byName(nm);
      if(!nm){ toast("Please type a name"); return; }
      if(other && other.id!==p.id){ toast("Another account here already uses that name"); return; }
      Profiles.rename(p.id, nm);
      Profiles.setPin(p.id, document.getElementById("acPin").value.trim());
      Profiles.setAvatar(p.id, face);
      paintAcctChip(); sound("correct"); toast("✓ Account updated"); go("account");
    };
    document.getElementById("acSwitch").onclick=()=>signOut();
    document.getElementById("acDelete").onclick=()=>{
      if(!confirm(`Delete ${p.name} and all of their progress on this device? This cannot be undone.`)) return;
      Profiles.remove(p.id); toast("Account deleted"); signOut();
    };
  }

  /* ---------- accounts ---------- */
  function paintAcctChip(){
    const p=Profiles.active(), chip=document.getElementById("acctChip");
    if(!chip) return;
    chip.style.display = p ? "flex" : "none";
    if(p){
      document.getElementById("acctFace").textContent=p.avatar||"🌱";
      document.getElementById("acctName").textContent=p.name;
      chip.title=`Signed in as ${p.name} — tap to switch account`;
    }
  }
  function enterApp(){
    state=load();
    paintAcctChip(); paintXP(); paintMute(); bumpStreak(); paintStreak();
    go("home");
  }
  function signOut(){
    Profiles.signOut();
    paintAcctChip();
    document.getElementById("topnav").innerHTML="";
    renderSignIn(document.getElementById("view"));
    window.scrollTo({top:0});
  }

  function init(){
    if(typeof I18N!=="undefined") I18N.init();
    Profiles.adoptLegacy();
    applyTheme(); paintAcctChip();
    if(!Profiles.active()){
      document.getElementById("topnav").innerHTML="";
      renderSignIn(document.getElementById("view"));
      return;
    }
    enterApp();
  }
  document.addEventListener("DOMContentLoaded", init);

  return { go, resetProgress, lockedMsg, toggleMute, toggleTheme, mascotSay, signOut, enterApp };
})();

</script>


</body></html>
